name: Release

# A release is a tag vX.Y.Z: it must match `version:` in pubspec.yaml and
# have a "## X.Y.Z" section in CHANGELOG.md. The full CI runs first; its
# builds are then published as a GitHub release with that section as the
# notes. Unsigned builds are not attached (they cannot be installed): the
# iOS app always, the APK when the repository has no signing secrets.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag, pubspec version and changelog agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          if ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    # The Android upload key, for a signed APK.
    secrets: inherit

  publish:
    needs: [check, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gitmarker-*
          path: artifacts
          merge-multiple: true
      - name: Name the files after the version
        run: |
          v="${{ needs.check.outputs.version }}"
          mkdir release
          for f in artifacts/*; do
            name="$(basename "$f")"
            case "$name" in
              *-unsigned*) continue ;;
            esac
            cp "$f" "release/${name/gitmarker-/GitMarker-$v-}"
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## ${{ needs.check.outputs.version }}" '
            $0 == h { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "GitMarker ${{ needs.check.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag
