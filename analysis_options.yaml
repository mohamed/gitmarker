# Lints and strictness for `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  # No implicit dynamic: casts, inferred types and generic types must be
  # explicit.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Futures must be awaited or explicitly marked (`.ignore()`,
    # `unawaited`), so no error is silently dropped.
    - unawaited_futures
    - discarded_futures
    # Stream subscriptions must be cancelled.
    - cancel_subscriptions
